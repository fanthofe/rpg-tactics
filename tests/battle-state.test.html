<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>BattleState Tests</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #1a1a2e; color: #e0e0e0; }
    .pass { color: #2ecc71; }
    .fail { color: #e74c3c; }
    h2 { color: #f0c040; margin: 16px 0 8px; }
  </style>
</head>
<body>
  <h1>BattleState Tests</h1>
  <div id="results"></div>
  <script type="module">
    import BattleState  from '../battle/BattleState.js';
    import PlayerState  from '../battle/PlayerState.js';

    const results = document.getElementById('results');
    let passed = 0, failed = 0;

    function test(name, fn) {
      try {
        fn();
        results.innerHTML += `<div class="pass">✓ ${name}</div>`;
        passed++;
      } catch (e) {
        results.innerHTML += `<div class="fail">✗ ${name}: ${e.message}</div>`;
        failed++;
      }
    }

    function assert(condition, msg) {
      if (!condition) throw new Error(msg || 'assertion failed');
    }
    function assertEqual(a, b) {
      if (a !== b) throw new Error(`expected ${b}, got ${a}`);
    }

    results.innerHTML += '<h2>Stats initiales</h2>';
    test('Hero démarre avec 100 PV', () => { const s = new BattleState(); assertEqual(s.heroHp, 100); assertEqual(s.heroMaxHp, 100); });
    test('Goblin démarre avec 80 PV', () => { const s = new BattleState(); assertEqual(s.goblinHp, 80); assertEqual(s.goblinMaxHp, 80); });
    test('Goblin ne se protège pas au départ', () => { const s = new BattleState(); assertEqual(s.goblinDefending, false); });

    results.innerHTML += '<h2>Attaque héros</h2>';
    test('heroAttack réduit les PV du goblin', () => {
      const s = new BattleState();
      const result = s.heroAttack();
      assert(result.rawDamage >= 18 && result.rawDamage <= 25, `rawDamage hors range: ${result.rawDamage}`);
      assert(result.damage >= 18, `damage trop bas: ${result.damage}`);
      assertEqual(s.goblinHp, 80 - result.damage);
    });
    test('heroAttack avec goblin en défense divise les dégâts par 2', () => {
      const s = new BattleState();
      s.goblinDefending = true;
      const result = s.heroAttack();
      assert(result.blocked === true);
      assertEqual(result.damage, Math.floor(result.rawDamage / 2));
      assertEqual(s.goblinDefending, false);
    });
    test('heroAttack ne descend pas sous 0', () => {
      const s = new BattleState(); s.goblinHp = 5; s.heroAttack(); assert(s.goblinHp >= 0);
    });

    results.innerHTML += '<h2>Soin héros</h2>';
    test('heroHeal restaure 30 PV', () => {
      const s = new BattleState(); s.heroHp = 50;
      const result = s.heroHeal();
      assertEqual(result.healed, 30); assertEqual(s.heroHp, 80);
    });
    test('heroHeal est plafonné au max', () => {
      const s = new BattleState(); s.heroHp = 90;
      const result = s.heroHeal();
      assertEqual(s.heroHp, 100); assertEqual(result.healed, 10);
    });
    test('heroHeal à plein PV soigne 0', () => {
      const s = new BattleState();
      const result = s.heroHeal();
      assertEqual(result.healed, 0); assertEqual(s.heroHp, 100);
    });

    results.innerHTML += '<h2>Attaque goblin</h2>';
    test('goblinAttack réduit les PV du héros', () => {
      const s = new BattleState(); // SPD=8 → dodgeChance=0, DEF=0 → no reduction
      const result = s.goblinAttack();
      assert(result.dodged === false, 'should not dodge at SPD=8');
      assert(result.damage >= 12 && result.damage <= 20, `dégâts hors range: ${result.damage}`);
      assertEqual(s.heroHp, 100 - result.damage);
    });

    results.innerHTML += '<h2>Défense goblin</h2>';
    test('goblinDefend active la défense', () => {
      const s = new BattleState(); s.goblinDefend(); assertEqual(s.goblinDefending, true);
    });
    test('canGoblinDefend false après goblinDefend', () => {
      const s = new BattleState(); s.goblinDefend(); assertEqual(s.canGoblinDefend(), false);
    });
    test('canGoblinDefend redevient true après goblinAttack', () => {
      const s = new BattleState(); s.goblinDefend(); s.goblinAttack(); assertEqual(s.canGoblinDefend(), true);
    });

    results.innerHTML += '<h2>Conditions de fin</h2>';
    test('isGoblinDead quand PV <= 0', () => { const s = new BattleState(); s.goblinHp = 0; assertEqual(s.isGoblinDead(), true); });
    test('isHeroDead quand PV <= 0', () => { const s = new BattleState(); s.heroHp = 0; assertEqual(s.isHeroDead(), true); });
    test('isGoblinDead false quand PV > 0', () => { const s = new BattleState(); assertEqual(s.isGoblinDead(), false); });

    results.innerHTML += '<h2>IA Goblin</h2>';
    test('goblinAI retourne attack ou defend', () => {
      const s = new BattleState();
      for (let i = 0; i < 50; i++) {
        const a = s.goblinAI();
        assert(a === 'attack' || a === 'defend', `action inconnue: ${a}`);
      }
    });
    test('goblinAI attack si canGoblinDefend false', () => {
      const s = new BattleState(); s.goblinDefend();
      for (let i = 0; i < 50; i++) assertEqual(s.goblinAI(), 'attack');
    });

    results.innerHTML += '<h2>Intégration PlayerState</h2>';
    test('BattleState utilise heroMaxHp de PlayerState', () => {
      const p = new PlayerState();
      p.equip('helmet-iron', 'helmet'); // +10 HP
      const s = new BattleState(p);
      assertEqual(s.heroMaxHp, 110);
      assertEqual(s.heroHp,    110);
    });

    test('BattleState sans PlayerState utilise les valeurs par défaut', () => {
      const s = new BattleState();
      assertEqual(s.heroMaxHp, 100);
    });

    test('heroAttack() crit : LCK=50 → toujours critique', () => {
      const p = new PlayerState();
      p.baseStats.lck = 50; // crit chance = 100%
      const s = new BattleState(p);
      s.goblinHp = 999;
      const result = s.heroAttack();
      assert(result.crit === true, 'should crit');
      assert(result.damage >= 27, `damage=${result.damage}`); // min: floor(18*1.5)=27
    });

    test('heroAttack() pas de crit : LCK=0 → jamais critique', () => {
      const p = new PlayerState();
      p.baseStats.lck = 0;
      const s = new BattleState(p);
      s.goblinHp = 999;
      for (let i = 0; i < 20; i++) {
        const r = s.heroAttack();
        assert(r.crit === false, `crit inattendu à i=${i}`);
      }
    });

    test('goblinAttack() DEF=0 : aucune réduction', () => {
      const p = new PlayerState(); // def=0
      const s = new BattleState(p);
      for (let i = 0; i < 20; i++) {
        const r = s.goblinAttack();
        if (r.dodged) continue;
        assertEqual(r.damage, r.rawDamage);
      }
    });

    test('goblinAttack() DEF=20 : réduit les dégâts de ~50%', () => {
      const p = new PlayerState();
      p.baseStats.def = 20; // réduction = 20/(20+20) = 0.5
      const s = new BattleState(p);
      s.heroHp = 9999;
      for (let i = 0; i < 20; i++) {
        const r = s.goblinAttack();
        if (r.dodged) continue;
        const expected = Math.floor(r.rawDamage * 0.5);
        assertEqual(r.damage, expected);
      }
    });

    results.innerHTML += `<h2>Résultat : ${passed} passés, ${failed} échoués</h2>`;
  </script>
</body>
</html>
